name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install web dependencies
        working-directory: mobile
        run: npm install

      - name: Prepare offline web assets
        working-directory: mobile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/prepare_web.py

      - name: Add Android platform
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Patch launcher icon
        working-directory: mobile
        run: python scripts/patch_icon.py

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK with stable release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my-hub-release.p12"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -f 4 mobile/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/my-hub-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/my-hub-release.p12" \
            --ks-type PKCS12 \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out mobile/my-hub-android.apk \
            "$RUNNER_TEMP/my-hub-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose mobile/my-hub-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: my-hub-android
          path: mobile/my-hub-android.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest mobile/my-hub-android.apk \
            --title "My Hub Android" \
            --notes "Signed offline Android APK for personal use." \
            --target main
